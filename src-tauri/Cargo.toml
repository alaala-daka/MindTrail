[package]
name = "mindtrail"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
default-run = "mindtrail"

[features]
producer = ["dep:rmcp", "dep:hyper", "dep:hyper-util", "dep:time"]
producer-test-fixture = ["producer"]

[[bin]]
name = "mindtrail-producer"
path = "src/bin/mindtrail-producer.rs"
required-features = ["producer"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mindtrail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
getrandom = "0.3.4"
axum = "0.8.9"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["net", "rt", "sync", "time"] }
http-body-util = "0.1.3"
rmcp = { version = "=3.6.0", default-features = false, features = ["server"], optional = true }
hyper = { version = "=1.12.0", features = ["client", "http1"], optional = true }
hyper-util = { version = "=0.1.21", features = ["tokio"], optional = true }
time = { version = "=0.3.55", features = ["formatting"], optional = true }


[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
rmcp = { version = "=3.6.0", default-features = false, features = ["client", "transport-child-process"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true




[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_System_SystemServices", "Win32_System_IO", "Win32_UI_Shell", "Win32_System_Com", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices"] }
